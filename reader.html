<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>教材阅读 · I.MX6U Linux</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-title">
      <a id="back" href="./">‹ 计划</a>
      <h1 id="book-title">教材阅读</h1>
      <a id="original" hidden>原 PDF</a>
    </div>
    <form id="controls" class="toolbar-controls">
      <button type="button" id="previous" aria-label="上一页" disabled>‹</button>
      <input id="page-number" aria-label="跳到页码" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" disabled>
      <span id="page-total" aria-hidden="true"></span>
      <button type="button" id="next" aria-label="下一页" disabled>›</button>
      <span class="controls-gap"></span>
      <button type="button" id="zoom-out" aria-label="缩小" disabled>−</button>
      <button type="button" id="zoom-in" aria-label="放大" disabled>+</button>
    </form>
  </header>
  <div id="status" role="status" aria-live="polite">正在打开教材…</div>
  <main id="reader-scroll" aria-label="教材页面" aria-busy="true"></main>
  <script type="module" src="reader.mjs"></script>
</body>
</html>
