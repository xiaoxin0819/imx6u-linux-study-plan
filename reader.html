<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>教材阅读 · I.MX6U Linux</title>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const book = query.get("book");
      const limit = book === "app" ? 1115 : book === "drv" ? 1963 : 0;
      if (!limit) return;
      const page = Math.min(limit, Math.max(1, Number.parseInt(query.get("page"), 10) || 1));
      const image = document.createElement("link");
      image.rel = "preload";
      image.as = "image";
      image.fetchPriority = "high";
      image.href = "pdf/pages-v1/" + book + "/" + page + ".webp";
      document.head.append(image);
    })();
  </script>
  <link rel="stylesheet" href="reader.css?v=4">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-title">
        <a id="back" href="./">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4 6 8l4 4"/></svg>
          学习计划
        </a>
        <h1 id="book-title">教材阅读</h1>
        <a id="original" hidden>原 PDF
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>
        </a>
      </div>
      <div class="toolbar-controls">
        <form id="page-controls" class="control-group" aria-label="页码">
          <button type="button" id="previous" aria-label="上一页" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4 6 8l4 4"/></svg>
          </button>
          <label class="page-index">
            <input id="page-number" aria-label="跳到页码" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" disabled>
            <span id="page-total" aria-hidden="true"></span>
          </label>
          <button type="button" id="next" aria-label="下一页" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg>
          </button>
        </form>
        <form id="zoom-controls" class="control-group" aria-label="缩放">
          <button type="button" id="zoom-out" aria-label="缩小" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8"/></svg>
          </button>
          <label class="zoom-index" title="输入 75–300 的缩放比例">
            <input id="zoom-percent" aria-label="缩放比例（百分比）" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" disabled>
            <span aria-hidden="true">%</span>
          </label>
          <button type="button" id="zoom-in" aria-label="放大" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8M8 4v8"/></svg>
          </button>
          <button type="button" id="zoom-reset" aria-label="恢复适合宽度" disabled>适宽</button>
        </form>
      </div>
    </div>
    <div id="status">
      <span id="status-message" role="status" aria-live="polite">正在打开教材…</span>
      <button type="button" id="retry" hidden>重试</button>
    </div>
  </header>
  <main id="reader-scroll" aria-label="教材页面" tabindex="0"><div id="pdf-rail"></div></main>
  <script type="module" src="reader.mjs?v=5"></script>
</body>
</html>
